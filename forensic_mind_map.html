<div class="hint">Drag / swipe to pan · Mouse wheel or pinch to zoom</div>
<script>
(() => {
  const viewport = document.getElementById('viewport');
  const svg = document.getElementById('map');
  let scale = 1, x = 0, y = 0;
  let pointers = new Map();
  let startX = 0, startY = 0, originX = 0, originY = 0;
  let pinchStartDistance = 0, pinchStartScale = 1;

  function applyTransform() {
    svg.style.transformOrigin = '0 0';
    svg.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
  }
  function distance(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
  }
  viewport.addEventListener('pointerdown', e => {
    viewport.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (pointers.size === 1) {
      viewport.classList.add('dragging');
      startX = e.clientX; startY = e.clientY;
      originX = x; originY = y;
    } else if (pointers.size === 2) {
      const pts = [...pointers.values()];
      pinchStartDistance = distance(pts[0], pts[1]);
      pinchStartScale = scale;
    }
  });
  viewport.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (pointers.size === 1) {
      x = originX + (e.clientX - startX);
      y = originY + (e.clientY - startY);
      applyTransform();
    } else if (pointers.size === 2) {
      const pts = [...pointers.values()];
      const nextScale = pinchStartScale * distance(pts[0], pts[1]) / pinchStartDistance;
      scale = Math.min(2.5, Math.max(.35, nextScale));
      applyTransform();
    }
  });
  function endPointer(e) {
    pointers.delete(e.pointerId);
    if (pointers.size === 0) viewport.classList.remove('dragging');
    if (pointers.size === 1) {
      const p = [...pointers.values()][0];
      startX = p.x; startY = p.y; originX = x; originY = y;
    }
  }
  viewport.addEventListener('pointerup', endPointer);
  viewport.addEventListener('pointercancel', endPointer);
  viewport.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.08 : .92;
    const rect = viewport.getBoundingClientRect();
    const px = e.clientX - rect.left, py = e.clientY - rect.top;
    const next = Math.min(2.5, Math.max(.35, scale * factor));
    x = px - (px - x) * (next / scale);
    y = py - (py - y) * (next / scale);
    scale = next;
    applyTransform();
  }, {passive:false});
  applyTransform();
})();
</script>
